name: Bug report
description: Something doesn't work or got slower
labels: [bug]
body:
  - type: input
    id: mac
    attributes:
      label: Mac model and chip
      placeholder: "MacBook Air M2, 16 GB"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "27.2"
    validations:
      required: true
  - type: input
    id: crossover
    attributes:
      label: CrossOver version
      placeholder: "26.3.0"
    validations:
      required: true
  - type: input
    id: trebuchet
    attributes:
      label: Trebuchet version
      description: Trebuchet menu → About Trebuchet
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Trebuchet → Show Log. Paste the last lines. Remove your user name and anything else private first.
      render: text
