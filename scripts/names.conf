# Player-facing text: the ONE place to rename the launcher and the fixes and to change their explanations.
# Read by the app (Settings, summary, popovers), run-aoe2.sh (warnings), build-app.sh and install.sh (APP_NAME).
# Format: KEY=text (no quotes). Per fix <ID>: FIX_ = name, GAIN_ = measured gain (empty = none shown),
# INFO_ = popover text, DETECT_ = 1 = "unique to Trebuchet" (the user's two-class line, 22.11.: only fixes no standard
# CrossOver setup has; Wine/DXMT/C-runtime/Rosetta-side fixes stay unmarked). Later G presets get their own mark.
APP_NAME=Trebuchet
TAGLINE=Trebuchet. Bringing a classic to modern silicon.
BUNDLE_ID=io.github.kyrios.trebuchet
# Addresses (one place): the website and the code repository.
SITE_URL=https://trebuchetapp.com
REPO_URL=https://github.com/kyrios/TrebuchetApp
# Launchers of earlier versions that this install replaces (removed only if their bundle id matches).
OLD_APP_NAMES=AoE2 DE (Part A)
OLD_BUNDLE_IDS=local.aoe2de.parta

STATEMENT=No game file and no byte of the game's code is ever changed. For a few small sections, Rosetta translates the code into faster equivalent instructions, with results proven identical.
FOOTNOTE=Gains measured on a Mac Studio M2 Max in offline replays unless marked as an estimate; FPS figures are Metal HUD readings. Your Mac may differ.
LEGEND=Marked fixes change how a few parts of the game's code run, in ways no standard CrossOver setup does. No game file and no byte of the game's code is changed, and results are proven identical. Tested offline only. If you want zero difference from a standard CrossOver setup online, switch them off.

FIX_PARTA=Quick Traps
GAIN_PARTA=60 units selected: 10–12 → 22 FPS (Metal HUD reading)
INFO_PARTA=The game deliberately trips the processor thousands of times a second. On a Mac each trip took a slow detour through macOS; Quick Traps hands it straight back to the game. It is the base for every other fix; "All fixes off" turns it off.
DETECT_PARTA=1

FIX_REORDER=Swift Health Bars
GAIN_REORDER=worst case, 37 units selected, health bars on: 22 → 150 FPS (Metal HUD reading)
INFO_REORDER=Every health bar asks a small question many times per frame. Rosetta is shown the same question with its cheap part first, so the answer is the same but much faster. Turn it off if health bars ever look wrong; it switches itself off after a game update it doesn't know.
DETECT_REORDER=1

FIX_RPATH=Renderer Guard
GAIN_RPATH=keeps the chosen graphics path
INFO_RPATH=Makes sure the graphics path you pick is the one that actually loads, instead of a slower fallback. Always on.
DETECT_RPATH=

FIX_DXMT=Metal Renderer
GAIN_DXMT=about 25 % less CPU per frame than wined3d, no periodic 150 ms stall
INFO_DXMT=DXMT draws the game directly through Apple's Metal. Compared with CrossOver's OpenGL path (wined3d) it needs about a quarter less processor time per frame and has no periodic 150 ms stutter; frame rates were similar in single runs. You can pick D3DMetal or wined3d instead.
DETECT_DXMT=

FIX_TEXTFIX=Clear Menu Text
GAIN_TEXTFIX=readable menu buttons with DXMT
INFO_TEXTFIX=Fixes the garbled button labels in the menus with DXMT graphics, using our own DXMT build. Turning it off uses CrossOver's DXMT, with the broken labels.
DETECT_TEXTFIX=

FIX_F54A=Hitch Guard
GAIN_F54A=freezes of 0.15–0.23 s every 30–40 s → under 5 ms
INFO_F54A=Rosetta tidies up every 30–40 seconds and used to freeze the game while doing it. Hitch Guard adjusts Rosetta itself so it tidies up in small steps; the frame rate stays the same, the freezes go. Turning it off brings them back.
DETECT_F54A=

FIX_FASTQPC=Fast Clock
GAIN_FASTQPC=about 0.6 s faster loading (estimate)
INFO_FASTQPC=The game reads the clock millions of times while loading. Fast Clock answers those reads faster; the loading gain is an estimate, not measured in the game. Optional and off by default, because it is newer and less tested than the other fixes.
DETECT_FASTQPC=

FIX_UCRT=Modern C Runtime
GAIN_UCRT=
INFO_UCRT=Your bottle uses Microsoft's 2015 pre-release C runtime. If you choose to, one file in the bottle (windows/system32/ucrtbase.dll) is replaced by the newer Microsoft copy already in your bottle; the game folder is not touched, a checksummed backup is kept, and undo restores it exactly. Nothing changes without you.
DETECT_UCRT=

FIX_MSYNC=Fast Sync
GAIN_MSYNC=
INFO_MSYNC=A CrossOver setting that lets the game wait for Wine with less overhead. It can help when the game's main thread limits the frame rate; a gain is shown here once repeated measurements confirm it. It applies when this launcher starts Steam.
DETECT_MSYNC=

FIX_T13=Lean Stack Check
GAIN_T13=
INFO_T13=A safety check the game runs on most function returns is shown to Rosetta in a shorter, identical form. Same result, fewer instructions. It switches itself off after a game update it doesn't know.
DETECT_T13=1

FIX_T4=Local Cursor
GAIN_T4=
INFO_T4=Cursor and text-caret requests are answered inside the game process instead of a round trip to the Wine server.
DETECT_T4=

